name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install build-tools
        run: |
          sdkmanager "build-tools;37.0.0" > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" > /dev/null 2>&1 || true
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          cd ${{ github.workspace }}
          # ★★★ نکته حیاتی: کپی کامل SDK به مسیر مورد انتظار Buildozer ★★★
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk
          cp -r $ANDROID_HOME/build-tools /home/runner/.buildozer/android/platform/android-sdk/
          cp -r $ANDROID_HOME/platforms /home/runner/.buildozer/android/platform/android-sdk/
          cp -r $ANDROID_HOME/platform-tools /home/runner/.buildozer/android/platform/android-sdk/
          cp -r $ANDROID_HOME/licenses /home/runner/.buildozer/android/platform/android-sdk/
          # نکته: تبدیل cmdline-tools به tools برای اینکه Buildozer sdkmanager را پیدا کند
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools
          cp -r $ANDROID_HOME/cmdline-tools/latest/* /home/runner/.buildozer/android/platform/android-sdk/tools/
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
