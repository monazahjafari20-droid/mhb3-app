name: Build APK Final

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install cython buildozer

      - name: Build APK
        run: |
          cd ${{ github.workspace }}
          
          # 1. مجوزهای SDK را میپذیریم (برای جلوگیری از خطای Aidl)
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # 2. به Buildozer میگوییم از SDK گیتهاب استفاده کند (نه یک SDK جدید دانلود کند)
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROID_HOME="$ANDROID_HOME"
          
          # 3. اجرای بیلد
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mhb-apk
          path: bin/*.apk
